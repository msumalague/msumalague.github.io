<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>Signature forgery detection: original illustration</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1630"/><stop offset="1" stop-color="#140f22"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b794ff" stop-opacity=".18"/><stop offset="1" stop-color="#b794ff" stop-opacity="0"/></radialGradient>
    <style>
      .scan { animation: scan 4.5s ease-in-out infinite; }
      @keyframes scan { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(268px); } }
      @media (prefers-reduced-motion: reduce) { .scan { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">SIGNATURE FORGERY DETECTION</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">YOLOv3 detector · image, webcam, and video input</text>

  <!-- questioned document -->
  <g transform="translate(40 104)">
    <rect width="330" height="236" rx="6" fill="url(#paper)" stroke="#b794ff" stroke-opacity=".25"/>
    <g fill="#bdb4cc" fill-opacity=".18">
      <rect x="24" y="26" width="180" height="7" rx="3"/><rect x="24" y="44" width="250" height="7" rx="3"/>
      <rect x="24" y="62" width="220" height="7" rx="3"/><rect x="24" y="80" width="140" height="7" rx="3"/>
    </g>
    <path d="M24 196h220" stroke="#8f86a0" stroke-opacity=".5" stroke-dasharray="3 4"/>
    <path d="M40 186c10-38 26-52 30-30s-14 40-4 34 22-44 34-40-8 34 4 32 18-30 30-28 2 26 14 22 20-36 32-34-6 30 8 26 24-24 40-18" fill="none" stroke="#efeaf7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 150h4M30 150v4M250 150h-4M250 150v4M30 200h4M30 200v-4M250 200h-4M250 200v-4" stroke="#f4b860" stroke-width="2"/>
    <rect x="30" y="150" width="220" height="50" fill="none" stroke="#f4b860" stroke-opacity=".5" stroke-dasharray="5 4"/>
    <rect x="30" y="128" width="96" height="18" fill="#f4b860" fill-opacity=".15" stroke="#f4b860" stroke-width="1"/>
    <text x="38" y="141" fill="#f4b860" font-size="11">forged?</text>
    <text x="24" y="224" fill="#8f86a0" font-size="10" letter-spacing="1">QUESTIONED SAMPLE</text>
  </g>

  <!-- comparison core -->
  <circle cx="400" cy="222" r="70" fill="url(#glow)"/>
  <g stroke="#b794ff" fill="none">
    <circle cx="400" cy="222" r="26" stroke-width="1.5"/>
    <circle cx="400" cy="222" r="38" stroke-opacity=".3" stroke-dasharray="4 5"/>
    <path d="M370 222h-14M444 222h-14M400 192v-12M400 264v-12" stroke-width="1.5"/>
  </g>
  <path d="M390 214l20 8-20 8z" fill="#b794ff"/>

  <!-- reference -->
  <g transform="translate(430 104)">
    <rect width="330" height="236" rx="6" fill="url(#paper)" stroke="#b794ff" stroke-opacity=".25"/>
    <g fill="#bdb4cc" fill-opacity=".18">
      <rect x="24" y="26" width="200" height="7" rx="3"/><rect x="24" y="44" width="160" height="7" rx="3"/>
    </g>
    <path d="M24 196h220" stroke="#8f86a0" stroke-opacity=".5" stroke-dasharray="3 4"/>
    <path d="M40 186c12-42 30-54 32-30s-12 38-2 32 24-46 36-40-6 32 6 30 20-32 32-28 0 26 12 22 22-38 34-34-4 30 10 26 26-26 42-20" fill="none" stroke="#efeaf7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="30" y="150" width="226" height="50" fill="none" stroke="#b794ff" stroke-width="1.5"/>
    <rect x="30" y="128" width="96" height="18" fill="#b794ff" fill-opacity=".15" stroke="#b794ff" stroke-width="1"/>
    <text x="38" y="141" fill="#ddccff" font-size="11">genuine</text>
    <text x="24" y="224" fill="#8f86a0" font-size="10" letter-spacing="1">REFERENCE SAMPLE</text>
  </g>

  <!-- scan line over the questioned sample -->
  <g class="scan"><rect x="60" y="250" width="2" height="54" fill="#b794ff" opacity=".8"/></g>

  <!-- input modes -->
  <g transform="translate(40 384)" font-size="11" fill="#bdb4cc">
    <rect width="230" height="72" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <rect x="18" y="20" width="34" height="28" rx="3" fill="none" stroke="#b794ff" stroke-width="1.5"/>
    <path d="M22 44l9-10 7 7 5-5 7 8" fill="none" stroke="#b794ff" stroke-width="1.5"/>
    <text x="66" y="32" fill="#efeaf7">IMAGE</text><text x="66" y="50" fill="#8f86a0">import a scan</text>
  </g>
  <g transform="translate(285 384)" font-size="11" fill="#bdb4cc">
    <rect width="230" height="72" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <circle cx="35" cy="32" r="13" fill="none" stroke="#b794ff" stroke-width="1.5"/><circle cx="35" cy="32" r="5" fill="#b794ff"/>
    <path d="M26 52h18" stroke="#b794ff" stroke-width="1.5"/>
    <text x="66" y="32" fill="#efeaf7">WEBCAM</text><text x="66" y="50" fill="#8f86a0">live feed</text>
  </g>
  <g transform="translate(530 384)" font-size="11" fill="#bdb4cc">
    <rect width="230" height="72" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <rect x="18" y="20" width="26" height="24" rx="3" fill="none" stroke="#b794ff" stroke-width="1.5"/>
    <path d="M44 28l10-6v20l-10-6" fill="none" stroke="#b794ff" stroke-width="1.5"/>
    <text x="66" y="32" fill="#efeaf7">VIDEO</text><text x="66" y="50" fill="#8f86a0">import a clip</text>
  </g>
</svg>
