<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>Property operations platform: original illustration</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <style>
      .spin { transform-box: fill-box; transform-origin: center; animation: spin 12s linear infinite; }
      .flow { stroke-dasharray: 3 5; animation: flow 1.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      @media (prefers-reduced-motion: reduce) { .spin, .flow { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">PROPERTY OPERATIONS PLATFORM</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">onboarding tracker · scheduled integrations</text>

  <!-- kanban -->
  <g transform="translate(40 100)" font-size="9">
    <g fill="#8f86a0"><text x="0" y="10">PHASE 1</text><text x="74" y="10">PHASE 2</text><text x="148" y="10">PHASE 3</text><text x="222" y="10">PHASE 4</text><text x="296" y="10">PHASE 5</text></g>
    <g fill="#120e1c" stroke="#b794ff" stroke-opacity=".2">
      <rect x="0" y="20" width="66" height="250" rx="4"/><rect x="74" y="20" width="66" height="250" rx="4"/><rect x="148" y="20" width="66" height="250" rx="4"/><rect x="222" y="20" width="66" height="250" rx="4"/><rect x="296" y="20" width="66" height="250" rx="4"/>
    </g>
    <g>
      <rect x="6" y="30" width="54" height="28" rx="3" fill="#221a36" stroke="#b794ff" stroke-opacity=".6"/><path d="M14 44l4 4 8-8" stroke="#b794ff" stroke-width="1.6" fill="none"/>
      <rect x="6" y="64" width="54" height="28" rx="3" fill="#221a36" stroke="#b794ff" stroke-opacity=".6"/><path d="M14 78l4 4 8-8" stroke="#b794ff" stroke-width="1.6" fill="none"/>
      <rect x="6" y="98" width="54" height="28" rx="3" fill="#221a36" stroke="#b794ff" stroke-opacity=".6"/><path d="M14 112l4 4 8-8" stroke="#b794ff" stroke-width="1.6" fill="none"/>
      <rect x="80" y="30" width="54" height="28" rx="3" fill="#221a36" stroke="#b794ff" stroke-opacity=".6"/><path d="M88 44l4 4 8-8" stroke="#b794ff" stroke-width="1.6" fill="none"/>
      <rect x="80" y="64" width="54" height="28" rx="3" fill="#1d1630" stroke="#f4b860"/><circle cx="92" cy="78" r="4" fill="#f4b860"/>
      <rect x="80" y="98" width="54" height="28" rx="3" fill="#120e1c" stroke="#8f86a0" stroke-opacity=".4" stroke-dasharray="3 3"/>
      <rect x="154" y="30" width="54" height="28" rx="3" fill="#1d1630" stroke="#b794ff" stroke-opacity=".4"/>
      <rect x="154" y="64" width="54" height="28" rx="3" fill="#1d1630" stroke="#b794ff" stroke-opacity=".4"/>
      <rect x="154" y="98" width="54" height="28" rx="3" fill="#120e1c" stroke="#8f86a0" stroke-opacity=".4" stroke-dasharray="3 3"/>
      <rect x="228" y="30" width="54" height="28" rx="3" fill="#1d1630" stroke="#b794ff" stroke-opacity=".4"/>
      <rect x="228" y="64" width="54" height="28" rx="3" fill="#1d1630" stroke="#b794ff" stroke-opacity=".4"/>
      <rect x="302" y="30" width="54" height="28" rx="3" fill="#1d1630" stroke="#b794ff" stroke-opacity=".4"/>
    </g>
    <g transform="translate(176 190)">
      <circle r="42" fill="none" stroke="#221a36" stroke-width="8"/>
      <circle r="42" fill="none" stroke="#b794ff" stroke-width="8" stroke-dasharray="110 264" transform="rotate(-90)"/>
      <text y="4" fill="#efeaf7" font-size="10" text-anchor="middle">progress</text>
    </g>
    <text x="0" y="296" fill="#8f86a0" font-size="10" letter-spacing="1">CONDITIONAL TASK GROUPS · OWNERS</text>
  </g>

  <!-- scheduler hub -->
  <g transform="translate(590 230)">
    <g stroke="#b794ff" stroke-opacity=".55" fill="none" class="flow">
      <path d="M0 0-96-96M0 0 96-96M0 0 126 0M0 0 96 96M0 0-96 96M0 0-126 0"/>
    </g>
    <circle r="36" fill="#1d1630" stroke="#b794ff" stroke-width="1.6"/>
    <g class="spin"><circle r="26" fill="none" stroke="#b794ff" stroke-opacity=".35" stroke-dasharray="3 5"/></g>
    <path d="M0-14V0l10 6" stroke="#efeaf7" stroke-width="2" fill="none"/>
    <g font-size="9" fill="#bdb4cc" text-anchor="middle">
      <g transform="translate(-96 -96)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><path d="M-14-8h8v16h-8zM-2-8h8v10h-8zM10-8h6v6h-6z" fill="#b794ff" fill-opacity=".6"/><text y="32">boards</text></g>
      <g transform="translate(96 -96)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><path d="M-10-12h14l6 6v18h-20z" fill="none" stroke="#efeaf7" stroke-opacity=".7"/><text y="32">PDF reports</text></g>
      <g transform="translate(126 0)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><path d="M-14-8h28v16h-28zM-14-8l14 10 14-10" fill="none" stroke="#efeaf7" stroke-opacity=".7"/><text y="32">digests</text></g>
      <g transform="translate(96 96)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><path d="M-14-10h28v20h-28zM-14-3h28M-14 4h28M-4-10v20M6-10v20" fill="none" stroke="#efeaf7" stroke-opacity=".6"/><text y="32">workbooks</text></g>
      <g transform="translate(-96 96)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><path d="M-14-8h10l4 4h14v14h-28z" fill="none" stroke="#efeaf7" stroke-opacity=".7"/><text y="32">drive</text></g>
      <g transform="translate(-126 0)"><rect x="-26" y="-18" width="52" height="36" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><path d="M-12 8l6-14 6 8 4-4 8 10z" fill="#b794ff" fill-opacity=".5"/><text y="32">reviews</text></g>
    </g>
  </g>

  <g transform="translate(40 424)" font-size="10" fill="#8f86a0">
    <text x="0" y="14">Flask · HTMX · PostgreSQL · CI · Playwright · Docker</text>
    <text x="440" y="14">scheduled jobs · drift checks</text>
  </g>
</svg>
