<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>GEO Studio: original illustration of the transcript-to-content pipeline</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <radialGradient id="cl" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b794ff" stop-opacity=".22"/><stop offset="1" stop-color="#b794ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#221a36"/><stop offset="1" stop-color="#140f22"/></linearGradient>
    <style>
      .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">GEO STUDIO · CONTENT INTELLIGENCE</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">transcripts → redaction → retrieval → decision gate → drafts + QA</text>

  <!-- sales calls -->
  <g font-size="10" fill="#8f86a0">
    <g transform="translate(40 112)">
      <rect width="128" height="46" rx="10" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/>
      <g fill="#b794ff" fill-opacity=".7"><rect x="14" y="20" width="4" height="8"/><rect x="22" y="15" width="4" height="18"/><rect x="30" y="18" width="4" height="12"/><rect x="38" y="12" width="4" height="24"/><rect x="46" y="17" width="4" height="14"/><rect x="54" y="20" width="4" height="8"/><rect x="62" y="14" width="4" height="20"/><rect x="70" y="19" width="4" height="10"/></g>
      <text x="84" y="28">call</text>
    </g>
    <g transform="translate(40 176)">
      <rect width="128" height="46" rx="10" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/>
      <g fill="#b794ff" fill-opacity=".7"><rect x="14" y="16" width="4" height="16"/><rect x="22" y="20" width="4" height="8"/><rect x="30" y="12" width="4" height="24"/><rect x="38" y="18" width="4" height="12"/><rect x="46" y="14" width="4" height="20"/><rect x="54" y="21" width="4" height="6"/><rect x="62" y="16" width="4" height="16"/><rect x="70" y="20" width="4" height="8"/></g>
      <text x="84" y="28">call</text>
    </g>
    <g transform="translate(40 240)">
      <rect width="128" height="46" rx="10" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/>
      <g fill="#b794ff" fill-opacity=".7"><rect x="14" y="19" width="4" height="10"/><rect x="22" y="13" width="4" height="22"/><rect x="30" y="17" width="4" height="14"/><rect x="38" y="20" width="4" height="8"/><rect x="46" y="12" width="4" height="24"/><rect x="54" y="16" width="4" height="16"/><rect x="62" y="20" width="4" height="8"/><rect x="70" y="15" width="4" height="18"/></g>
      <text x="84" y="28">call</text>
    </g>
    <text x="40" y="314" letter-spacing="1">SALES CALLS</text>
  </g>

  <!-- redaction funnel -->
  <path d="M190 112h56l-10 174h-36z" fill="#120e1c" stroke="#b794ff" stroke-opacity=".35"/>
  <g fill="#06040b"><rect x="198" y="136" width="40" height="7"/><rect x="200" y="166" width="36" height="7"/><rect x="202" y="196" width="32" height="7"/><rect x="204" y="226" width="28" height="7"/></g>
  <rect x="193" y="252" width="50" height="16" fill="#f4b860" fill-opacity=".15" stroke="#f4b860"/>
  <text x="203" y="264" fill="#f4b860" font-size="10">PII</text>
  <text x="196" y="314" fill="#8f86a0" font-size="10" letter-spacing="1">REDACT</text>

  <!-- vector space -->
  <circle cx="350" cy="200" r="96" fill="url(#cl)"/>
  <g stroke="#b794ff" stroke-opacity=".25" fill="none">
    <path d="M300 160l22 14 18-22M322 174l-6 26M372 150l24 10 10 24-26 6M420 224l20 22-16 22M308 240l26 10 10 24"/>
  </g>
  <g fill="#b794ff">
    <circle cx="300" cy="160" r="4"/><circle cx="322" cy="174" r="5"/><circle cx="340" cy="152" r="3.5"/><circle cx="316" cy="200" r="3.5"/>
    <circle cx="372" cy="150" r="4"/><circle cx="396" cy="160" r="5"/><circle cx="406" cy="184" r="3.5"/><circle cx="380" cy="190" r="3.5"/>
    <circle cx="420" cy="224" r="4" fill="#ddccff"/><circle cx="440" cy="246" r="5" fill="#ddccff"/><circle cx="424" cy="268" r="3.5" fill="#ddccff"/>
    <circle cx="308" cy="240" r="4"/><circle cx="334" cy="250" r="5"/><circle cx="344" cy="274" r="3.5"/>
  </g>
  <text x="292" y="314" fill="#8f86a0" font-size="10" letter-spacing="1">EMBEDDINGS · PGVECTOR</text>

  <!-- decision gate -->
  <g fill="none" stroke="#b794ff" stroke-opacity=".6" class="flow"><path d="M168 200h22"/><path d="M246 200h40"/><path d="M450 200h52"/></g>
  <path d="M540 162l38 38-38 38-38-38z" fill="#1d1630" stroke="#f4b860" stroke-width="1.8" class="pulse"/>
  <text x="540" y="204" fill="#f4b860" font-size="10" text-anchor="middle">GATE</text>
  <g font-size="10">
    <path d="M578 200h30" stroke="#b794ff" fill="none"/><path d="M566 176c20-20 30-30 42-30" stroke="#8f86a0" fill="none"/><path d="M566 224c20 20 30 30 42 30" stroke="#f4b860" fill="none"/>
    <text x="612" y="150" fill="#8f86a0">block</text><text x="612" y="258" fill="#f4b860">reframe</text>
  </g>

  <!-- draft -->
  <g transform="translate(612 170)">
    <rect width="150" height="120" rx="5" fill="url(#paper)" stroke="#b794ff" stroke-opacity=".5"/>
    <g fill="#bdb4cc" fill-opacity=".25"><rect x="14" y="16" width="90" height="7" rx="3" fill="#efeaf7" fill-opacity=".6"/><rect x="14" y="34" width="120" height="5" rx="2"/><rect x="14" y="46" width="110" height="5" rx="2"/><rect x="14" y="58" width="122" height="5" rx="2"/><rect x="14" y="70" width="80" height="5" rx="2"/></g>
    <rect x="14" y="88" width="98" height="20" rx="3" fill="#b794ff" fill-opacity=".15" stroke="#b794ff"/>
    <path d="M22 98l5 5 9-10" stroke="#b794ff" stroke-width="1.6" fill="none"/>
    <text x="42" y="102" fill="#ddccff" font-size="10">QA · claims</text>
  </g>
  <text x="612" y="314" fill="#8f86a0" font-size="10" letter-spacing="1">GROUNDED DRAFT</text>

  <!-- AI visibility -->
  <g transform="translate(40 360)">
    <rect width="722" height="94" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <text x="20" y="28" fill="#b794ff" font-size="10" letter-spacing="1.3">AI ANSWER-ENGINE VISIBILITY</text>
    <text x="20" y="46" fill="#8f86a0" font-size="10">budgeted, PII-scrubbed snapshots · versioned benchmark panels</text>
    <g font-size="11" fill="#efeaf7">
      <g transform="translate(20 60)"><rect width="150" height="22" rx="11" fill="none" stroke="#b794ff" stroke-opacity=".5"/><circle cx="14" cy="11" r="4" fill="#b794ff"/><text x="26" y="15">ChatGPT</text></g>
      <g transform="translate(184 60)"><rect width="150" height="22" rx="11" fill="none" stroke="#b794ff" stroke-opacity=".5"/><circle cx="14" cy="11" r="4" fill="#ddccff"/><text x="26" y="15">Claude</text></g>
      <g transform="translate(348 60)"><rect width="150" height="22" rx="11" fill="none" stroke="#b794ff" stroke-opacity=".5"/><circle cx="14" cy="11" r="4" fill="#8b5cf6"/><text x="26" y="15">Gemini</text></g>
      <g transform="translate(512 60)"><rect width="150" height="22" rx="11" fill="none" stroke="#b794ff" stroke-opacity=".5"/><circle cx="14" cy="11" r="4" fill="#f4b860"/><text x="26" y="15">Perplexity</text></g>
    </g>
  </g>
</svg>
