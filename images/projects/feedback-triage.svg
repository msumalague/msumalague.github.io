<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>Customer feedback triage, LLM vs ML baseline: original illustration</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <style>
      .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      .gear { transform-box: fill-box; transform-origin: center; animation: spin 8s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .flow, .gear { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">FEEDBACK TRIAGE · LLM vs. ML BASELINE</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">category · priority · sentiment, evaluated side by side</text>

  <!-- feedback bubbles -->
  <g fill="#120e1c" stroke="#b794ff" stroke-opacity=".35">
    <path d="M40 110h120a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H70l-12 12v-12H40a8 8 0 0 1-8-8v-26a8 8 0 0 1 8-8z"/>
    <path d="M40 190h120a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H70l-12 12v-12H40a8 8 0 0 1-8-8v-26a8 8 0 0 1 8-8z"/>
    <path d="M40 270h120a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H70l-12 12v-12H40a8 8 0 0 1-8-8v-26a8 8 0 0 1 8-8z"/>
  </g>
  <g fill="#bdb4cc" fill-opacity=".35"><rect x="44" y="122" width="100" height="5" rx="2"/><rect x="44" y="134" width="70" height="5" rx="2"/><rect x="44" y="202" width="110" height="5" rx="2"/><rect x="44" y="214" width="60" height="5" rx="2"/><rect x="44" y="282" width="90" height="5" rx="2"/><rect x="44" y="294" width="104" height="5" rx="2"/></g>
  <text x="32" y="352" fill="#8f86a0" font-size="10" letter-spacing="1">FREE-TEXT FEEDBACK</text>

  <!-- lanes -->
  <g fill="none" stroke="#b794ff" stroke-opacity=".6" class="flow"><path d="M176 200c30 0 30-70 60-70"/><path d="M176 220c30 0 30 70 60 70"/></g>
  <g transform="translate(240 96)">
    <rect width="200" height="72" rx="5" fill="#1d1630" stroke="#b794ff"/>
    <text x="16" y="30" fill="#ddccff" font-size="20">{ }</text>
    <text x="62" y="28" fill="#efeaf7" font-size="11">LLM classifier</text>
    <text x="62" y="46" fill="#8f86a0" font-size="10">few-shot · JSON schema</text>
    <text x="62" y="60" fill="#8f86a0" font-size="10">temperature 0</text>
  </g>
  <g transform="translate(240 254)">
    <rect width="200" height="72" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/>
    <g class="gear" fill="none" stroke="#b794ff" stroke-width="1.6"><circle cx="30" cy="36" r="11"/><path d="M30 19v-5M30 58v-5M13 36H8M52 36h-5M18 24l-3-3M45 51l-3-3M18 48l-3 3M45 21l-3 3"/></g>
    <text x="62" y="28" fill="#efeaf7" font-size="11">ML baseline</text>
    <text x="62" y="46" fill="#8f86a0" font-size="10">TF-IDF word + char</text>
    <text x="62" y="60" fill="#8f86a0" font-size="10">logistic regression</text>
  </g>
  <path d="M340 168v86" stroke="#f4b860" stroke-dasharray="3 5" stroke-opacity=".8"/>
  <text x="350" y="216" fill="#f4b860" font-size="9">LLM labels can</text>
  <text x="350" y="228" fill="#f4b860" font-size="9">train the baseline</text>

  <!-- bins -->
  <g fill="none" stroke="#b794ff" stroke-opacity=".6" class="flow"><path d="M440 132c30 0 30 70 60 70"/><path d="M440 290c30 0 30-70 60-70"/></g>
  <g transform="translate(504 150)" font-size="12" text-anchor="middle">
    <g><rect width="46" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><text x="23" y="36" fill="#efeaf7">C</text></g>
    <g transform="translate(52 0)"><rect width="46" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><text x="23" y="36" fill="#efeaf7">R</text></g>
    <g transform="translate(104 0)"><rect width="46" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><text x="23" y="36" fill="#efeaf7">I</text></g>
    <g transform="translate(156 0)"><rect width="46" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><text x="23" y="36" fill="#efeaf7">E</text></g>
    <g transform="translate(208 0)"><rect width="46" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".5"/><text x="23" y="36" fill="#efeaf7">S</text></g>
    <path d="M10-14h10l-4 5 4 5H10z" fill="#f4b860"/><path d="M114-14h10l-4 5 4 5h-10z" fill="#b794ff"/><path d="M218-14h10l-4 5 4 5h-10z" fill="#8f86a0"/>
  </g>
  <text x="504" y="236" fill="#8f86a0" font-size="9">complaint · request · inquiry ·</text>
  <text x="504" y="248" fill="#8f86a0" font-size="9">encouragement · suggestion</text>

  <!-- evaluation -->
  <g transform="translate(40 384)" font-size="10">
    <rect width="722" height="72" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <text x="20" y="26" fill="#b794ff" letter-spacing="1.2">EVALUATION</text>
    <text x="20" y="48" fill="#bdb4cc">per-class + macro precision / recall on a stratified hold-out</text>
    <g transform="translate(520 18)"><rect width="16" height="36" fill="#b794ff" fill-opacity=".25"/><rect x="22" width="16" height="36" fill="#8b5cf6" fill-opacity=".25"/><rect x="60" width="16" height="36" fill="#b794ff" fill-opacity=".25"/><rect x="82" width="16" height="36" fill="#8b5cf6" fill-opacity=".25"/>
      <text x="116" y="16" fill="#8f86a0">LLM</text><text x="116" y="32" fill="#8f86a0">ML</text></g>
  </g>
</svg>
