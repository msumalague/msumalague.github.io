<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>Crypto regime forecasting and autonomous trading: original illustration</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b794ff" stop-opacity=".28"/><stop offset="1" stop-color="#b794ff" stop-opacity="0"/></linearGradient>
    <style>
      .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">MARKET-REGIME FORECASTING → RISK-GUARDED EXECUTION</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">illustrative figure · daily cycle · 9 forecast horizons</text>

  <!-- sources -->
  <g font-size="10" fill="#bdb4cc">
    <g transform="translate(40 100)"><rect width="112" height="30" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/><text x="12" y="19">market</text></g>
    <g transform="translate(40 138)"><rect width="112" height="30" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/><text x="12" y="19">sentiment</text></g>
    <g transform="translate(40 176)"><rect width="112" height="30" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/><text x="12" y="19">volatility</text></g>
    <g transform="translate(40 214)"><rect width="112" height="30" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/><text x="12" y="19">derivatives</text></g>
  </g>

  <!-- index + event labels -->
  <g transform="translate(180 100)">
    <rect width="220" height="144" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <rect x="70" y="8" width="34" height="128" fill="#f4b860" fill-opacity=".1"/>
    <rect x="150" y="8" width="24" height="128" fill="#f4b860" fill-opacity=".1"/>
    <path d="M10 92 30 80 46 86 62 60 76 70 88 104 100 112 116 90 132 74 146 52 160 88 172 98 188 70 210 56V136H10Z" fill="url(#area)"/>
    <path d="M10 92 30 80 46 86 62 60 76 70 88 104 100 112 116 90 132 74 146 52 160 88 172 98 188 70 210 56" fill="none" stroke="#b794ff" stroke-width="1.8"/>
    <text x="10" y="24" fill="#8f86a0" font-size="10">altcoin index</text>
    <text x="72" y="130" fill="#f4b860" font-size="9">event</text>
  </g>

  <!-- model zoo -->
  <g fill="none" stroke="#b794ff" stroke-opacity=".6" class="flow"><path d="M152 172h28"/><path d="M400 172h30"/></g>
  <g font-size="9" fill="#bdb4cc" text-anchor="middle">
    <g transform="translate(450 104)">
      <circle cx="16" cy="16" r="16" fill="#120e1c" stroke="#b794ff"/><text x="16" y="20">ET</text>
      <circle cx="58" cy="16" r="16" fill="#120e1c" stroke="#b794ff"/><text x="58" y="20">RF</text>
      <circle cx="16" cy="60" r="16" fill="#120e1c" stroke="#b794ff"/><text x="16" y="64">LR</text>
      <circle cx="58" cy="60" r="16" fill="#120e1c" stroke="#b794ff"/><text x="58" y="64">HGB</text>
      <circle cx="16" cy="104" r="16" fill="#120e1c" stroke="#b794ff"/><text x="16" y="108">XGB</text>
      <circle cx="58" cy="104" r="16" fill="#120e1c" stroke="#b794ff"/><text x="58" y="108">LGBM</text>
    </g>
  </g>
  <g stroke="#b794ff" stroke-opacity=".35" fill="none"><path d="M524 120c20 0 26 52 40 52M524 164h40M524 208c20 0 26-36 40-36"/></g>
  <path d="M590 148l22 12v26l-22 12-22-12v-26z" fill="#1d1630" stroke="#ddccff" stroke-width="1.6"/>
  <text x="590" y="177" fill="#ddccff" font-size="9" text-anchor="middle">ENS</text>

  <!-- gauges -->
  <g font-size="10" text-anchor="middle">
    <g transform="translate(690 140)">
      <path d="M-42 0a42 42 0 0 1 84 0" fill="none" stroke="#221a36" stroke-width="8"/>
      <path d="M-42 0a42 42 0 0 1 60-38" fill="none" stroke="#b794ff" stroke-width="8"/>
      <g><path d="M0 0 18-30" stroke="#efeaf7" stroke-width="2"/></g>
      <circle r="3" fill="#efeaf7"/><text y="20" fill="#bdb4cc">upturn 0–100</text>
    </g>
    <g transform="translate(690 222)">
      <path d="M-42 0a42 42 0 0 1 84 0" fill="none" stroke="#221a36" stroke-width="8"/>
      <path d="M-42 0a42 42 0 0 1 22-36" fill="none" stroke="#f4b860" stroke-width="8"/>
      <g><path d="M0 0-24-28" stroke="#efeaf7" stroke-width="2"/></g>
      <circle r="3" fill="#efeaf7"/><text y="20" fill="#bdb4cc">downturn 0–100</text>
    </g>
  </g>
  <path d="M612 172h30" stroke="#b794ff" stroke-opacity=".6" fill="none" class="flow"/>

  <!-- trading layer -->
  <g transform="translate(40 300)">
    <text x="0" y="0" fill="#b794ff" font-size="10" letter-spacing="1.3">TRADING LAYER</text>
    <g font-size="10" fill="#efeaf7">
      <g transform="translate(0 16)"><rect width="130" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".35"/><text x="12" y="24">signal</text><text x="12" y="42" fill="#8f86a0">merged up/down</text></g>
      <g transform="translate(150 16)"><rect width="130" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".35"/><text x="12" y="24">strategy</text><text x="12" y="42" fill="#8f86a0">multi-day confirm</text></g>
      <g transform="translate(300 16)"><rect width="150" height="58" rx="4" fill="#1d1630" stroke="#f4b860"/>
        <path d="M124 14l12-5 12 5v12c0 9-6 15-12 18-6-3-12-9-12-18z" fill="none" stroke="#f4b860" stroke-width="1.5" transform="translate(-6 0)"/>
        <text x="12" y="24">risk guards</text><text x="12" y="42" fill="#8f86a0">caps · kill switch</text></g>
      <g transform="translate(470 16)"><rect width="130" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".35"/>
        <path d="M14 36l10-12 10 12M44 24l10 12 10-12" fill="none" stroke="#b794ff" stroke-width="1.6"/><text x="74" y="34">exchange</text></g>
      <g transform="translate(620 16)"><rect width="102" height="58" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".35"/><text x="12" y="24">audit</text><text x="12" y="42" fill="#8f86a0">alerts · log</text></g>
    </g>
    <g stroke="#b794ff" stroke-opacity=".6" fill="none" class="flow"><path d="M130 45h20M280 45h20M450 45h20M600 45h20"/></g>
  </g>
  <g transform="translate(40 418)" font-size="10" fill="#8f86a0">
    <circle cx="10" cy="10" r="9" fill="none" stroke="#b794ff" stroke-opacity=".6"/><path d="M10 4v6l4 3" stroke="#b794ff" fill="none"/>
    <text x="28" y="14">daily: fetch → features → retrain → predict → merge → act</text>
  </g>
</svg>
