<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>Listing-to-parcel vision agent: original illustration</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <radialGradient id="fuzz" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b794ff" stop-opacity=".35"/><stop offset=".7" stop-color="#b794ff" stop-opacity=".1"/><stop offset="1" stop-color="#b794ff" stop-opacity="0"/></radialGradient>
    <style>
      .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.8s ease-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @keyframes ping { from { transform: scale(.4); opacity: .8; } to { transform: scale(1.3); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .ping { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">LISTING → PARCEL VISION AGENT</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">geospatial narrowing · vision-LLM comparison · confidence gate</text>

  <!-- approximate location -->
  <g transform="translate(40 96)">
    <rect width="190" height="190" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <g stroke="#b794ff" stroke-opacity=".1"><path d="M0 60h190M0 120h190M60 0v190M120 0v190"/><path d="M0 150c40-20 80 10 190-40" stroke-opacity=".25" stroke-width="5"/></g>
    <circle cx="96" cy="94" r="70" fill="url(#fuzz)"/>
    <circle cx="96" cy="94" r="40" fill="none" stroke="#b794ff" class="ping"/>
    <path d="M96 76c-9 0-15 7-15 15 0 12 15 26 15 26s15-14 15-26c0-8-6-15-15-15z" fill="#b794ff"/><circle cx="96" cy="91" r="5" fill="#120e1c"/>
    <text x="12" y="180" fill="#8f86a0" font-size="10">approximate pin</text>
  </g>

  <!-- parcels -->
  <g fill="none" stroke="#b794ff" stroke-opacity=".6" class="flow"><path d="M230 190h30"/></g>
  <g transform="translate(262 96)" font-size="11">
    <rect width="190" height="190" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <g fill="#181227" stroke="#b794ff" stroke-opacity=".55">
      <path d="M16 20h70l-4 50H14z"/><path d="M98 18h76v46h-72z"/><path d="M14 84h66l6 52H18z"/><path d="M96 80h80l-6 58h-70z" stroke="#ddccff" stroke-opacity="1" stroke-width="1.8" fill="#221a36"/><path d="M40 150h110v28H40z"/>
    </g>
    <g fill="#bdb4cc"><text x="42" y="50">A</text><text x="132" y="46">B</text><text x="44" y="116">C</text><text x="130" y="114" fill="#ddccff">D</text><text x="90" y="169">E</text></g>
    <text x="12" y="204" fill="#8f86a0" font-size="10">county parcels, ranked</text>
  </g>

  <!-- comparison -->
  <g fill="none" stroke="#b794ff" stroke-opacity=".6" class="flow"><path d="M452 190h30"/></g>
  <g transform="translate(484 96)">
    <rect width="132" height="88" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".35"/>
    <path d="M22 60l34-28 34 28z" fill="#2a2140" stroke="#bdb4cc" stroke-opacity=".6"/><rect x="30" y="60" width="52" height="18" fill="#221a36"/>
    <rect x="90" y="64" width="30" height="12" rx="2" fill="#8b5cf6" fill-opacity=".6"/>
    <text x="10" y="16" fill="#8f86a0" font-size="9">LISTING PHOTO</text>
  </g>
  <g transform="translate(484 198)">
    <rect width="132" height="88" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".35"/>
    <path d="M24 28h54v36H24z" fill="#2a2140" stroke="#bdb4cc" stroke-opacity=".6"/><path d="M24 28l27 18 27-18M51 46v18" stroke="#bdb4cc" stroke-opacity=".4" fill="none"/>
    <rect x="88" y="40" width="28" height="14" rx="2" fill="#8b5cf6" fill-opacity=".6"/>
    <text x="10" y="16" fill="#8f86a0" font-size="9">AERIAL · PARCEL D</text>
  </g>
  <g transform="translate(630 120)" font-size="10" fill="#bdb4cc">
    <text x="0" y="0" fill="#b794ff" letter-spacing="1">SIGNALS</text>
    <g transform="translate(0 16)"><path d="M0 6l4 4 8-9" stroke="#b794ff" stroke-width="1.6" fill="none"/><text x="18" y="10">pool</text></g>
    <g transform="translate(0 38)"><path d="M0 6l4 4 8-9" stroke="#b794ff" stroke-width="1.6" fill="none"/><text x="18" y="10">roofline</text></g>
    <g transform="translate(0 60)"><path d="M0 6l4 4 8-9" stroke="#b794ff" stroke-width="1.6" fill="none"/><text x="18" y="10">lot shape</text></g>
    <g transform="translate(0 92)">
      <path d="M40 0l34 34-34 34L6 34z" fill="#1d1630" stroke="#f4b860" stroke-width="1.6"/>
      <text x="40" y="31" fill="#f4b860" text-anchor="middle" font-size="9">≥2 + conf</text>
      <text x="40" y="44" fill="#f4b860" text-anchor="middle" font-size="9">gate</text>
    </g>
  </g>

  <!-- outputs -->
  <g transform="translate(40 318)" font-size="10" fill="#efeaf7">
    <rect width="722" height="132" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <g transform="translate(20 22)"><rect width="200" height="40" rx="4" fill="#b794ff" fill-opacity=".12" stroke="#b794ff"/><text x="14" y="25">confirmed match</text></g>
    <g transform="translate(20 72)"><rect width="200" height="40" rx="4" fill="#f4b860" fill-opacity=".1" stroke="#f4b860"/><text x="14" y="25" fill="#f4b860">human review queue</text></g>
    <g transform="translate(250 22)" fill="#bdb4cc">
      <text x="0" y="12" fill="#b794ff" letter-spacing="1">VISION PROVIDER</text>
      <rect x="0" y="22" width="92" height="24" rx="12" fill="none" stroke="#b794ff"/><text x="14" y="38" fill="#efeaf7">Claude</text>
      <rect x="100" y="22" width="92" height="24" rx="12" fill="none" stroke="#b794ff" stroke-opacity=".4"/><text x="114" y="38">Gemini</text>
      <text x="0" y="74">model pin · retries · cost cap</text>
    </g>
    <g transform="translate(500 22)" fill="#bdb4cc">
      <text x="0" y="12" fill="#b794ff" letter-spacing="1">WEEKLY RUN</text>
      <text x="0" y="36">dedupe → sheet + CRM</text>
      <text x="0" y="56">alerts on crash / hang</text>
      <text x="0" y="76">guard: no auto-outreach</text>
    </g>
  </g>
</svg>
