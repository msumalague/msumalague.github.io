<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>Revenue analytics workbook generator: original illustration</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <style>
      .flow { stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -20; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">REVENUE CUBE → FORMULA-DRIVEN WORKBOOK</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">illustrative figure · every output cell is a live formula</text>

  <!-- cube -->
  <g transform="translate(70 130)">
    <path d="M90 0l90 46-90 46L0 46z" fill="#2a2140" stroke="#b794ff" stroke-opacity=".7"/>
    <path d="M0 46l90 46v104L0 150z" fill="#1d1630" stroke="#b794ff" stroke-opacity=".7"/>
    <path d="M180 46 90 92v104l90-46z" fill="#181227" stroke="#b794ff" stroke-opacity=".7"/>
    <g stroke="#b794ff" stroke-opacity=".2" fill="none"><path d="M30 61v104M60 76v104M120 76v104M150 61v104M0 81l90 46 90-46M0 116l90 46 90-46"/></g>
    <g font-size="10" fill="#ddccff"><text x="70" y="50">period</text><text x="12" y="140" transform="rotate(27 12 140)">customer</text><text x="112" y="150" transform="rotate(-27 112 150)">segment</text></g>
  </g>
  <!-- llm lens -->
  <g transform="translate(286 156)">
    <circle cx="34" cy="34" r="30" fill="#120e1c" stroke="#b794ff" stroke-width="1.6"/>
    <path d="M56 56l18 18" stroke="#b794ff" stroke-width="3" stroke-linecap="round"/>
    <text x="34" y="31" fill="#efeaf7" font-size="10" text-anchor="middle">LLM</text>
    <text x="34" y="44" fill="#8f86a0" font-size="8" text-anchor="middle">schema</text>
  </g>
  <text x="270" y="262" fill="#8f86a0" font-size="9">+ regex fallback</text>
  <path d="M386 226h36" fill="none" stroke="#b794ff" stroke-opacity=".6" class="flow"/>

  <!-- workbook tabs -->
  <g transform="translate(430 104)">
    <rect x="18" y="-6" width="320" height="250" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <rect x="9" y="3" width="320" height="250" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".3"/>
    <rect width="320" height="250" rx="4" fill="#160f25" stroke="#b794ff" stroke-opacity=".6"/>
    <g font-size="9">
      <rect x="0" y="250" width="70" height="20" fill="#1d1630" stroke="#b794ff"/><text x="12" y="264" fill="#ddccff">bridge</text>
      <rect x="72" y="250" width="70" height="20" fill="#120e1c" stroke="#b794ff" stroke-opacity=".4"/><text x="82" y="264" fill="#8f86a0">cohorts</text>
      <rect x="144" y="250" width="70" height="20" fill="#120e1c" stroke="#b794ff" stroke-opacity=".4"/><text x="154" y="264" fill="#8f86a0">movers</text>
      <rect x="216" y="250" width="70" height="20" fill="#120e1c" stroke="#b794ff" stroke-opacity=".4"/><text x="228" y="264" fill="#8f86a0">margin</text>
    </g>
    <text x="16" y="24" fill="#8f86a0" font-size="10">revenue bridge</text>
    <g>
      <rect x="20" y="70" width="34" height="110" fill="#b794ff" fill-opacity=".55"/>
      <rect x="66" y="50" width="34" height="20" fill="#ddccff" fill-opacity=".7"/>
      <rect x="112" y="70" width="34" height="18" fill="#f4b860" fill-opacity=".7"/>
      <rect x="158" y="44" width="34" height="26" fill="#ddccff" fill-opacity=".7"/>
      <rect x="204" y="60" width="34" height="16" fill="#f4b860" fill-opacity=".7"/>
      <rect x="250" y="60" width="34" height="120" fill="#8b5cf6" fill-opacity=".7"/>
      <path d="M54 70h12M100 50h12M146 88h12M192 44h12M238 60h12" stroke="#bdb4cc" stroke-opacity=".4" stroke-dasharray="2 2"/>
    </g>
    <g font-size="10" fill="#bdb4cc" font-style="italic">
      <rect x="16" y="196" width="88" height="22" rx="2" fill="none" stroke="#b794ff" stroke-opacity=".3"/><text x="24" y="211">=SUMIFS(…)</text>
      <rect x="112" y="196" width="72" height="22" rx="2" fill="none" stroke="#b794ff" stroke-opacity=".3"/><text x="120" y="211">=RRI(…)</text>
      <rect x="192" y="196" width="112" height="22" rx="2" fill="none" stroke="#b794ff" stroke-opacity=".3"/><text x="200" y="211">=SUMPRODUCT(…)</text>
    </g>
  </g>

  <g transform="translate(40 396)" font-size="10">
    <rect width="722" height="62" rx="5" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
    <text x="20" y="26" fill="#b794ff" letter-spacing="1.2">ANALYSES</text>
    <text x="20" y="46" fill="#bdb4cc">revenue bridge · customer waterfall · cohorts · like-for-like · top movers · margin corkscrew</text>
  </g>
</svg>
