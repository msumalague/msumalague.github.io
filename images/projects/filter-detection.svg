<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="JetBrains Mono, Consolas, Menlo, monospace">
  <title>Industrial filter detection: original illustration</title>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#b794ff" stroke-opacity=".05"/></pattern>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2140"/><stop offset="1" stop-color="#120e1c"/></linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2d5c"/><stop offset="1" stop-color="#1d1630"/></linearGradient>
    <clipPath id="filterClip"><ellipse cx="0" cy="0" rx="150" ry="58"/></clipPath>
    <clipPath id="tileClip"><ellipse cx="0" cy="0" rx="58" ry="22"/></clipPath>
    <style>
      .sweep { animation: sweep 5s ease-in-out infinite; }
      @keyframes sweep { 0%, 100% { transform: translateY(0); opacity: 0; } 10%, 90% { opacity: .9; } 50% { transform: translateY(200px); } }
      @media (prefers-reduced-motion: reduce) { .sweep { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect width="800" height="500" fill="#0b0814"/>
  <rect width="800" height="500" fill="url(#g)"/>
  <text x="40" y="52" fill="#b794ff" font-size="12" letter-spacing="1.5">INDUSTRIAL OBJECT DETECTION</text>
  <text x="40" y="70" fill="#8f86a0" font-size="11">one class · varying states, angles, occlusion</text>

  <!-- equipment housing -->
  <path d="M60 120h400l-30 300H90z" fill="url(#steel)" stroke="#b794ff" stroke-opacity=".2"/>
  <path d="M60 120h400v26H60z" fill="#221a36"/>
  <g transform="translate(260 290)">
    <ellipse rx="150" ry="58" fill="url(#mesh)" stroke="#bdb4cc" stroke-opacity=".5" stroke-width="1.5"/>
    <g clip-path="url(#filterClip)" stroke="#bdb4cc" stroke-opacity=".35">
      <path d="M-160-80l120 160M-130-80l120 160M-100-80l120 160M-70-80l120 160M-40-80l120 160M-10-80l120 160M20-80l120 160M50-80l120 160M80-80l120 160M110-80l120 160"/>
    </g>
    <ellipse rx="150" ry="58" fill="none" stroke="#efeaf7" stroke-opacity=".25" stroke-width="5"/>
  </g>
  <!-- operator arm partially occluding -->
  <path d="M470 170c-40 30-90 70-140 120l26 22c50-46 100-82 140-110z" fill="#3b2f55" opacity=".95"/>
  <circle cx="338" cy="306" r="16" fill="#463a63"/>
  <!-- detection -->
  <rect x="102" y="222" width="316" height="138" fill="none" stroke="#b794ff" stroke-width="2"/>
  <rect x="102" y="200" width="68" height="22" fill="#b794ff"/>
  <text x="112" y="215" fill="#12061f" font-size="12" font-weight="600">filter</text>
  <g class="sweep"><rect x="102" y="160" width="316" height="2" fill="#b794ff"/></g>

  <!-- validation grid -->
  <text x="500" y="112" fill="#8f86a0" font-size="10" letter-spacing="1.2">VALIDATION SAMPLES</text>
  <g font-size="10" fill="#bdb4cc">
    <g transform="translate(500 124)">
      <rect width="120" height="120" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
      <g transform="translate(60 66)"><ellipse rx="58" ry="22" fill="#1d1630"/><g clip-path="url(#tileClip)" stroke="#bdb4cc" stroke-opacity=".35"><path d="M-60-30l40 60M-40-30l40 60M-20-30l40 60M0-30l40 60M20-30l40 60M40-30l40 60"/></g></g>
      <rect x="6" y="40" width="108" height="52" fill="none" stroke="#b794ff" stroke-width="1.5"/>
      <text x="8" y="112">open</text>
    </g>
    <g transform="translate(640 124)">
      <rect width="120" height="120" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
      <g transform="translate(60 66)"><ellipse rx="58" ry="22" fill="#2a2140"/><ellipse rx="58" ry="22" fill="none" stroke="#bdb4cc" stroke-opacity=".4"/></g>
      <rect x="6" y="40" width="108" height="52" fill="none" stroke="#b794ff" stroke-width="1.5"/>
      <text x="8" y="112">covered</text>
    </g>
    <g transform="translate(500 262)">
      <rect width="120" height="120" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
      <g transform="translate(60 66)"><ellipse rx="58" ry="22" fill="#1d1630"/><g clip-path="url(#tileClip)" stroke="#bdb4cc" stroke-opacity=".35"><path d="M-60-30l40 60M-40-30l40 60M-20-30l40 60M0-30l40 60M20-30l40 60M40-30l40 60"/></g></g>
      <path d="M120 20c-20 18-44 38-66 62l12 10c22-22 44-42 58-56z" fill="#3b2f55"/>
      <rect x="6" y="40" width="108" height="52" fill="none" stroke="#f4b860" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="8" y="112" fill="#f4b860">occluded</text>
    </g>
    <g transform="translate(640 262)">
      <rect width="120" height="120" rx="4" fill="#120e1c" stroke="#b794ff" stroke-opacity=".2"/>
      <g transform="translate(60 66) rotate(-14)"><ellipse rx="58" ry="22" fill="#1d1630"/><g clip-path="url(#tileClip)" stroke="#bdb4cc" stroke-opacity=".35"><path d="M-60-30l40 60M-40-30l40 60M-20-30l40 60M0-30l40 60M20-30l40 60M40-30l40 60"/></g></g>
      <rect x="6" y="36" width="108" height="60" fill="none" stroke="#b794ff" stroke-width="1.5"/>
      <text x="8" y="112">angled</text>
    </g>
  </g>
  <g font-size="11" fill="#8f86a0">
    <text x="40" y="462">dataset checks</text><text x="190" y="462" fill="#b794ff">→</text>
    <text x="214" y="462">edge-case review</text><text x="382" y="462" fill="#b794ff">→</text>
    <text x="406" y="462">validation against real samples</text>
  </g>
</svg>
